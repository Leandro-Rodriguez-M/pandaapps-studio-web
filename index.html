<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PandaApps Studio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0C0F14;
      color: white;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 700px;
      padding: 40px;
      border-radius: 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: rgba(255,255,255,0.8);
    }

    .accent {
      color: #16E06E;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PandaApps Studio</h1>
    <p><span class="accent">Apps con identidad</span></p>
    <p>Primera publicación de prueba en Cloudflare Pages.</p>
  </div>
</body>
</html>
